<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="wcvm architecture: a host page talks to a kernel worker, which runs one process worker per PID; processes call a file system worker synchronously through a SharedArrayBuffer; a Service Worker relays iframe preview requests through the host page">
  <title>wcvm architecture</title>
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2652"/><stop offset="1" stop-color="#1c1a38"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#8f7cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f3f2ff; }
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #b7b3dc; }
    .l { font-size: 12px; font-weight: 600; }
    .node { fill: url(#fill); stroke: url(#stroke); stroke-width: 1.6; }
    .edge { fill: #15142a; stroke: #4b4880; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: #5b4fd6; stroke-width: 1.8; stroke-dasharray: 6 6; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 9px rgba(143,124,255,.75)); } }
    .pk { r: 4.5px; filter: url(#glow); offset-rotate: 0deg; animation: travel 6s linear infinite; opacity: 0; }
    @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 4% { opacity: 1; } 16% { offset-distance: 100%; opacity: 1; } 20%,100% { offset-distance: 100%; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .pulse, .pk { animation: none !important; } .pk { opacity: 0; } }
  </style>

  <rect width="920" height="480" fill="none"/>
  <rect x="10" y="10" width="900" height="460" rx="18" fill="#17162d" stroke="#34316a" stroke-width="1.5"/>
  <text x="32" y="40" class="l" style="fill:#22d3ee;font-size:14px">Browser tab · no backend</text>

  <rect class="edge" x="40" y="72" width="190" height="64" rx="10"/>
  <text x="135" y="100" text-anchor="middle" class="t">&lt;iframe&gt;</text>
  <text x="135" y="120" text-anchor="middle" class="s">dev server preview</text>

  <rect class="edge" x="300" y="72" width="230" height="64" rx="10"/>
  <text x="415" y="100" text-anchor="middle" class="t">Preview Service Worker</text>
  <text x="415" y="120" text-anchor="middle" class="s">/__wcvm_preview__/PORT/</text>

  <path class="line" d="M230 104H300" marker-end="url(#a)"/>
  <text x="265" y="94" text-anchor="middle" class="l" style="fill:#22d3ee">fetch</text>
  <path class="line" d="M530 104H620" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="575" y="94" text-anchor="middle" class="l" style="fill:#22d3ee">relay</text>

  <rect class="node pulse" x="620" y="72" width="270" height="64" rx="10"/>
  <text x="755" y="100" text-anchor="middle" class="t">Host page</text>
  <text x="755" y="120" text-anchor="middle" class="s">boot() · spawn · fs · preview</text>

  <rect class="node pulse" style="animation-delay:.8s" x="620" y="212" width="270" height="68" rx="10"/>
  <text x="755" y="242" text-anchor="middle" class="t">Kernel Worker</text>
  <text x="755" y="262" text-anchor="middle" class="s">process table · virtual network</text>

  <rect class="node pulse" style="animation-delay:1.6s" x="620" y="360" width="270" height="80" rx="10"/>
  <text x="755" y="390" text-anchor="middle" class="t">Process Workers (one per PID)</text>
  <text x="755" y="410" text-anchor="middle" class="s">sh · npm · node = Node's own lib/</text>
  <text x="755" y="428" text-anchor="middle" class="s">each one is a Web Worker</text>

  <rect class="node pulse" style="animation-delay:2.4s" x="270" y="360" width="230" height="80" rx="10"/>
  <text x="385" y="392" text-anchor="middle" class="t">File System Worker</text>
  <text x="385" y="412" text-anchor="middle" class="s">in-memory Vfs → OPFS</text>

  <path class="line" d="M755 136V212" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="767" y="179" class="l" style="fill:#f472b6">postMessage</text>
  <path class="line" d="M755 280V360" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="745" y="316" text-anchor="end" class="l" style="fill:#fbbf24">spawns</text>
  <text x="745" y="332" text-anchor="end" class="l" style="fill:#fbbf24">virtual sockets</text>
  <path class="line" d="M620 400H500" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="560" y="372" text-anchor="middle" class="l" style="fill:#4ade80">SharedArrayBuffer</text>
  <text x="560" y="387" text-anchor="middle" class="l" style="fill:#4ade80">+ Atomics.wait</text>
  <text x="560" y="424" text-anchor="middle" class="s" style="font-size:11.5px">synchronous</text>
  <text x="560" y="438" text-anchor="middle" class="s" style="font-size:11.5px">syscalls</text>

  <!-- a request travelling through the system: iframe -> service worker -> host -> kernel -> process -> file system -->
  <circle class="pk" fill="#22d3ee" style="offset-path:path('M230 104H300');animation-delay:0s"/>
  <circle class="pk" fill="#22d3ee" style="offset-path:path('M530 104H620');animation-delay:.6s"/>
  <circle class="pk" fill="#f472b6" style="offset-path:path('M755 136V212');animation-delay:1.2s"/>
  <circle class="pk" fill="#fbbf24" style="offset-path:path('M755 280V360');animation-delay:1.8s"/>
  <circle class="pk" fill="#4ade80" style="offset-path:path('M620 400H500');animation-delay:2.4s"/>
  <circle class="pk" fill="#4ade80" style="offset-path:path('M500 400H620');animation-delay:3.2s"/>
  <circle class="pk" fill="#fbbf24" style="offset-path:path('M755 360V280');animation-delay:3.8s"/>
  <circle class="pk" fill="#f472b6" style="offset-path:path('M755 212V136');animation-delay:4.4s"/>
  <circle class="pk" fill="#22d3ee" style="offset-path:path('M620 104H530');animation-delay:5s"/>
</svg>
